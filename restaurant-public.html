<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netfoodix Restaurant</title>
  <link rel="stylesheet" href="/restaurant-public.css" />
</head>
<body>
  <main class="page">
    <a class="back" href="/sub-index.html">← Netfoodix Home</a>
    <section id="hero" class="hero">
      <div class="cover" id="cover"></div>
      <div class="hero-body">
        <div id="logo" class="logo" role="img" aria-label="Restaurant logo">R</div>
        <div>
          <h1 id="name">Loading restaurant...</h1>
          <p id="meta" class="meta"></p>
          <p id="summary" class="summary"></p>
        </div>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Menu</h2>
        <div id="menu" class="menu"></div>
      </article>
      <article class="card">
        <h2>Blogs & Updates</h2>
        <div id="posts" class="posts"></div>
      </article>
    </section>
  </main>
  <script src="/restaurant-public.js"></script>
</body>
</html>
